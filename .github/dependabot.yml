version: 2
updates:
  # cooldown: a new package version is proposed only after it has been out
  # for 7 days - a hijacked release is usually caught and pulled by then.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
