name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monituj
          POSTGRES_USER: monituj
          POSTGRES_PASSWORD: monituj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monituj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://monituj:monituj@localhost:5432/monituj
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements/prod.txt
