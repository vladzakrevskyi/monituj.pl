{% extends "base/base.html" %}

{% block page_name %}Potwierdź nowy adres email{% endblock %}
{% block page_class %}page--compact{% endblock %}

{% block content %}
<div class="card">
<h1>Potwierdź nowy adres email</h1>
<p class="text-muted">Kliknij poniższy przycisk, aby ten adres zaczął być używany do logowania.</p>
<form method="post">
{% csrf_token %}
<button type="submit" class="btn btn-primary btn-block">Potwierdź nowy adres email</button>
</form>
</div>
{% endblock %}
