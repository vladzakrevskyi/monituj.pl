{% extends "base/base.html" %}

{% block title %}Ustaw nowe hasło - Monituj{% endblock %}
{% block page_class %}page--compact{% endblock %}

{% block content %}
<div class="card">
<h1>Ustaw nowe hasło</h1>
<form method="post" novalidate data-ajax-form data-replace-on-success>
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="btn btn-primary btn-block">Zapisz nowe hasło</button>
</form>
</div>
{% endblock %}
