<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<meta name="author" content="Monituj">
<style>
@page { size: A4; margin: 20mm 18mm 22mm; @bottom-center { content: "{{ footer }} · strona " counter(page) " z " counter(pages); font: 8pt "DejaVu Sans", Arial, sans-serif; color: #62636d; } }
body { margin: 0; color: #18181b; font: 10pt/1.5 "DejaVu Sans", Arial, sans-serif; }
.intro { padding: 8pt 10pt; background: #f7f7f8; border: 1px solid #e4e4e8; border-radius: 6pt; color: #3f3f46; }
.document { break-before: page; }
.document:first-of-type { break-before: auto; margin-top: 18pt; }
h1 { font-size: 16pt; line-height: 1.3; margin: 0 0 2pt; }
h2 { font-size: 12pt; margin: 16pt 0 6pt; break-after: avoid; }
.meta { color: #62636d; margin: 0 0 12pt; }
ol, ul { padding-left: 18pt; }
li { margin-bottom: 3pt; }
table { border-collapse: collapse; width: 100%; font-size: 9pt; }
tr { break-inside: avoid; }
th, td { border: 1px solid #d4d4d8; padding: 4pt 6pt; text-align: left; vertical-align: top; }
a { color: #c24e00; text-decoration: none; }
.legal-form { padding: 8pt 10pt; border: 1px dashed #a1a1aa; border-radius: 6pt; break-inside: avoid; }
</style>
</head>
<body>
<p class="intro">{{ intro }}</p>
{% for part in parts %}{{ part }}{% endfor %}
</body>
</html>
