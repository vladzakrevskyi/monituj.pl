# /etc/nginx/sites-available/monituj.conf
# Replace monituj.pl with your domain. certbot adds the HTTPS part itself.

server {
    listen 80;
    listen [::]:80;
    server_name monituj.pl www.monituj.pl;

    # Uploads are limited to 20 MB in the app; a little headroom here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (never append) the client address: the app uses it for
        # rate limits, so a visitor must not be able to forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
