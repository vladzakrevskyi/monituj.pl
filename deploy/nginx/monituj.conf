# /etc/nginx/sites-available/monituj.conf
# Replace monituj.pl with your domain. certbot adds the HTTPS part itself.

server {
    listen 80;
    listen [::]:80;
    server_name monituj.pl www.monituj.pl;

    # Behind Cloudflare: take the visitor's real address from Cloudflare
    # (only on requests coming from Cloudflare), so the allowlists below, the
    # maintenance mode and the rate limits see the visitor, not Cloudflare.
    # Without Cloudflare in front, remove this line.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Uploads are limited to 20 MB in the app; a little headroom here.
    client_max_body_size 25m;

    # The Django admin (ADMIN_URL in .env - keep this path the same) only
    # from your own addresses. Put your IP below (check it: curl ifconfig.me);
    # everyone else gets 403. Closed by default: forgetting this step leaves
    # the admin shut, never open to the world.
    location /admin/ {
        allow 127.0.0.1;
        # allow 83.12.34.56;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (never append) the client address: the app uses it for
        # rate limits, so a visitor must not be able to forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
