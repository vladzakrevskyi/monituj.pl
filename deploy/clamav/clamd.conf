# clamd for Monituj (docker-compose.prod.yml mounts it over the image's own
# /etc/clamav/clamd.conf). The first block repeats the image's settings;
# the second is ours (apps/documents/antivirus.py).

LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
LogFile /var/log/clamav/clamd.log
LogTime yes
DatabaseDirectory /var/lib/clamav

# Office files with macros are reported (Heuristics.OLE2.ContainsMacros) and
# refused: nothing a client needs to send, the commonest way into an office.
AlertOLE2Macros yes

# Uploads are at most 20 MB (validation.MAX_UPLOAD_SIZE); a little headroom.
StreamMaxLength 25M
MaxFileSize 25M

# A new signature set is loaded in place of the old one, not next to it:
# scanning pauses for a moment several times a day (uploads wait - the
# client's timeout is 90 s), but memory never doubles to ~2.4 GB.
ConcurrentDatabaseReload no
